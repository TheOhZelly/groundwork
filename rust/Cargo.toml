[workspace]
resolver = "2"
members = [
    "crates/groundwork-nbt",
    "crates/groundwork-anvil",
    "crates/groundwork-core",
    "crates/groundwork-export",
    "crates/groundwork-mcp",
    "crates/groundwork-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Groundwork contributors"]

[workspace.dependencies]
flate2 = "1"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
png = "0.17"
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "=0.15.0"
groundwork-nbt = { path = "crates/groundwork-nbt" }
groundwork-anvil = { path = "crates/groundwork-anvil" }
groundwork-core = { path = "crates/groundwork-core" }
groundwork-export = { path = "crates/groundwork-export" }

[profile.release]
lto = "thin"
